<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .line { animation: show 0.4s ease-out backwards; }
      .l1 { animation-delay: 0.2s; } .l2 { animation-delay: 0.5s; } .l3 { animation-delay: 0.8s; }
      .l4 { animation-delay: 1.1s; } .l5 { animation-delay: 1.4s; } .l6 { animation-delay: 1.7s; }
      .l7 { animation-delay: 2.0s; }
      @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>
  <rect x="0" y="336" width="1200" height="4" fill="url(#accent)"/>

  <!-- Texto principal -->
  <text x="64" y="118" class="sans" font-size="64" font-weight="700" fill="#f0f6fc">Pablo</text>
  <text x="64" y="162" class="sans" font-size="24" fill="#8b949e">Backend developer</text>
  <text x="64" y="196" class="sans" font-size="18" fill="#8b949e">Ingeniería en Sistemas, UMG  ·  Antigua Guatemala</text>

  <g class="mono" font-size="15">
    <rect x="64" y="236" width="128" height="34" rx="17" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.4"/>
    <text x="128" y="258" text-anchor="middle" fill="#3fb950">APIs REST</text>
    <rect x="204" y="236" width="150" height="34" rx="17" fill="#2f81f7" fill-opacity="0.12" stroke="#2f81f7" stroke-opacity="0.4"/>
    <text x="279" y="258" text-anchor="middle" fill="#58a6ff">Bases de datos</text>
    <rect x="366" y="236" width="140" height="34" rx="17" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.4"/>
    <text x="436" y="258" text-anchor="middle" fill="#bc8cff">Vue · Angular</text>
  </g>

  <!-- Ventana de terminal -->
  <g transform="translate(640 44)">
    <rect width="500" height="252" rx="12" fill="#010409" stroke="#30363d"/>
    <rect width="500" height="36" rx="12" fill="#161b22"/>
    <rect y="24" width="500" height="12" fill="#161b22"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="6" fill="#febc2e"/>
    <circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="250" y="23" text-anchor="middle" class="mono" font-size="13" fill="#6e7681">pablo.js</text>

    <g class="mono" font-size="15" xml:space="preserve">
      <text x="24" y="70" class="line l1"><tspan fill="#ff7b72">const</tspan><tspan fill="#d2a8ff"> pablo</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
      <text x="44" y="96" class="line l2"><tspan fill="#79c0ff">rol</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"backend dev"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="44" y="122" class="line l3"><tspan fill="#79c0ff">trabajo</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Muni de Antigua"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="44" y="148" class="line l4"><tspan fill="#79c0ff">backend</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"Node"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"NestJS"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"FastAPI"</tspan><tspan fill="#c9d1d9">],</tspan></text>
      <text x="44" y="174" class="line l5"><tspan fill="#79c0ff">datos</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"PostgreSQL"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Supabase"</tspan><tspan fill="#c9d1d9">],</tspan></text>
      <text x="44" y="200" class="line l6"><tspan fill="#79c0ff">aprendiendo</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"MongoDB"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="24" y="226" class="line l7"><tspan fill="#c9d1d9">};</tspan></text>
      <rect x="50" y="212" width="9" height="18" fill="#3fb950" class="cursor"/>
    </g>
  </g>
</svg>
